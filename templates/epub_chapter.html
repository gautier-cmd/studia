<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
{% for href in chapter.stylesheet_hrefs %}
<link rel="stylesheet" href="{{ href }}">
{% endfor %}
<style>
    /* padding uniquement sur body, jamais sur html : les deux cumulés
       (l'un imbriqué dans l'autre) ajoutent ~40px que ni la mesure de
       hauteur (body.scrollHeight) ni le redimensionnement de l'iframe
       ne voient - l'iframe se retrouve alors avec un défilement interne
       à elle en plus de celui de #reader-viewport (deux barres de
       défilement superposées). margin en !important sur body : sans
       ça, la propre feuille de style du livre (chargée après celle-ci,
       voir ensureStylesheets/epub_reader.html) peut lui redonner une
       marge, avec le même effet. */
    html {
        margin: 0;
        padding: 0;
    }
    body {
        margin: 0 !important;
        padding: 20px;
        background: #fff;
        color: #111;
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1.6;
    }
    img { max-width: 100%; height: auto; }
    table { max-width: 100%; }
</style>
</head>
<body>
{{ chapter.body_html | safe }}
</body>
</html>
