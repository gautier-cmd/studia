{% macro render_note(item_id, note_text, note_updated_at, player_context=None) %}
<div class="card note-card" id="notes">
    <div class="note-header">
        <h3>Notes</h3>
        <details class="hero-menu">
            <summary aria-label="Plus d'actions" title="Plus d'actions">⋮</summary>
            <div class="hero-menu-list" role="menu">
                <button type="button" class="hero-menu-item" id="print-note" role="menuitem">Imprimer</button>
            </div>
        </details>
    </div>

    <div id="local-restore-banner"></div>

    <div class="note-format-toolbar" role="toolbar" aria-label="Mise en forme Markdown">
        <button type="button" class="toolbar-btn" data-md="bold" title="Gras"><strong>G</strong></button>
        <button type="button" class="toolbar-btn" data-md="italic" title="Italique"><em>I</em></button>
        <button type="button" class="toolbar-btn" data-md="h1" title="Titre 1">T1</button>
        <button type="button" class="toolbar-btn" data-md="h2" title="Titre 2">T2</button>
        <button type="button" class="toolbar-btn" data-md="h3" title="Titre 3">T3</button>
        <button type="button" class="toolbar-btn" data-md="list" title="Liste">Liste</button>
        <button type="button" class="toolbar-btn" data-md="code" title="Bloc de code">Code</button>
        {% if player_context %}
        <button type="button" class="toolbar-btn" id="insert-marker" title="Insérer un repère">Repère</button>
        {% endif %}
        <button type="button" class="btn-mini" id="toggle-preview">Aperçu</button>
    </div>

    <textarea id="note-text" placeholder="Vos notes sur cette formation…">{{ note_text }}</textarea>
    <div id="note-preview" class="note-preview" hidden></div>

    <ul id="note-markers" class="note-markers"></ul>

    <div class="note-toolbar">
        <span id="note-saved-indicator" class="hint"></span>
    </div>
</div>

<script>
(function () {
    var itemId = {{ item_id | tojson }};
    var noteCard = document.getElementById('notes');
    var textarea = document.getElementById('note-text');
    var preview = document.getElementById('note-preview');
    var previewToggle = document.getElementById('toggle-preview');
    var indicator = document.getElementById('note-saved-indicator');
    var storageKey = 'studia-note-' + itemId;
    var saveTimer = null;
    var serverUpdatedAtMs = (function () {
        var iso = {{ note_updated_at | tojson }};
        return iso ? new Date(iso).getTime() : 0;
    })();

    function formatTime(date) {
        return date.toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
    }

    // Un repère est une ligne "texte (/watch/id?t=secondes)" ou
    // "texte (/listen/id?t=secondes)" selon le lecteur : le fragment
    // entre parenthèses sert à repositionner le lecteur, ce n'est pas
    // une information à montrer telle quelle (liste, aperçu,
    // impression) — seule la zone de saisie, en texte brut, le laisse
    // forcément visible.
    var MARKER_PATTERN = /^(.*)\((\/(?:watch|listen)\/\d+\?t=\d+)\)\s*$/;

    function markerLineRegex() {
        return new RegExp(MARKER_PATTERN.source, 'gm');
    }

    function findMarkers() {
        var re = markerLineRegex();
        var markers = [];
        var match;
        while ((match = re.exec(textarea.value)) !== null) {
            markers.push({
                label: match[1].trim(),
                href: match[2],
                start: match.index,
                end: match.index + match[0].length
            });
        }
        return markers;
    }

    function renderMarkers() {
        var list = document.getElementById('note-markers');
        list.innerHTML = '';
        findMarkers().forEach(function (marker) {
            var li = document.createElement('li');

            var a = document.createElement('a');
            a.href = marker.href;
            a.textContent = marker.label;
            li.appendChild(a);

            var remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'marker-remove';
            remove.title = 'Supprimer ce repère';
            remove.setAttribute('aria-label', 'Supprimer ce repère');
            remove.textContent = '✕';
            remove.addEventListener('click', function () {
                textarea.value = textarea.value.slice(0, marker.start) + textarea.value.slice(marker.end);
                textarea.dispatchEvent(new Event('input'));
            });
            li.appendChild(remove);

            list.appendChild(li);
        });
    }

    // Rendu Markdown minimal, limité à ce que la barre d'outils peut
    // produire (gras, italique, titres 1 à 3, liste, bloc de code) plus
    // les repères horodatés — pas un moteur Markdown complet, l'aperçu
    // et l'impression n'ont besoin de rien d'autre. Le texte est
    // échappé avant toute mise en forme : pas de HTML interprété dans
    // une note.
    function escapeHtml(text) {
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderInline(text) {
        text = escapeHtml(text);
        text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
        return text;
    }

    function renderMarkdown(text) {
        var lines = text.split('\n');
        var html = '';
        var paragraph = [];
        var i = 0;

        function flushParagraph() {
            if (paragraph.length) {
                html += '<p>' + paragraph.map(renderInline).join('<br>') + '</p>';
                paragraph = [];
            }
        }

        while (i < lines.length) {
            var line = lines[i];
            var marker = line.match(MARKER_PATTERN);
            var heading = line.match(/^(#{1,3})\s+(.*)$/);
            var listItem = line.match(/^[-*]\s+(.*)$/);

            if (marker) {
                flushParagraph();
                html += '<p><a href="' + marker[2] + '">' + escapeHtml(marker[1].trim()) + '</a></p>';
                i += 1;
                continue;
            }

            if (line.trim() === '```') {
                flushParagraph();
                var codeLines = [];
                i += 1;
                while (i < lines.length && lines[i].trim() !== '```') {
                    codeLines.push(lines[i]);
                    i += 1;
                }
                i += 1;
                html += '<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>';
                continue;
            }

            if (heading) {
                flushParagraph();
                var level = heading[1].length;
                html += '<h' + level + '>' + renderInline(heading[2]) + '</h' + level + '>';
                i += 1;
                continue;
            }

            if (listItem) {
                flushParagraph();
                var items = [];
                while (i < lines.length) {
                    var itemMatch = lines[i].match(/^[-*]\s+(.*)$/);
                    if (!itemMatch) {
                        break;
                    }
                    items.push(itemMatch[1]);
                    i += 1;
                }
                html += '<ul>' + items.map(function (item) {
                    return '<li>' + renderInline(item) + '</li>';
                }).join('') + '</ul>';
                continue;
            }

            if (line.trim() === '') {
                flushParagraph();
                i += 1;
                continue;
            }

            paragraph.push(line);
            i += 1;
        }

        flushParagraph();
        return html || '<p class="hint">Pas encore de note.</p>';
    }

    function saveToLocal() {
        try {
            localStorage.setItem(storageKey, JSON.stringify({
                text: textarea.value,
                savedAt: Date.now()
            }));
        } catch (e) {
            /* stockage local indisponible (navigation privee...) : tant pis, l'enregistrement serveur reste actif */
        }
    }

    function saveToServer(useBeacon) {
        var body = new URLSearchParams({text: textarea.value});

        if (useBeacon && navigator.sendBeacon) {
            navigator.sendBeacon(
                '/item/' + itemId + '/note',
                new Blob([body.toString()], {type: 'application/x-www-form-urlencoded'})
            );
            return;
        }

        fetch('/item/' + itemId + '/note', {method: 'POST', body: body})
            .then(function (response) { return response.json(); })
            .then(function () {
                indicator.textContent = 'Enregistré à ' + formatTime(new Date());
            })
            .catch(function () {
                indicator.textContent = 'Non enregistré — connexion perdue';
            });
    }

    textarea.addEventListener('input', function () {
        saveToLocal();
        renderMarkers();
        indicator.textContent = 'Frappe en cours…';
        clearTimeout(saveTimer);
        saveTimer = setTimeout(function () { saveToServer(false); }, 900);
    });

    document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') {
            saveToServer(true);
        }
    });

    window.addEventListener('beforeprint', function () {
        document.getElementById('print-note-text').innerHTML = renderMarkdown(textarea.value);
        document.querySelector('#print-only .print-date').textContent =
            new Date().toLocaleDateString('fr-FR');
    });

    document.getElementById('print-note').addEventListener('click', function () {
        var menu = document.querySelector('#notes details.hero-menu');
        if (menu) {
            menu.open = false;
        }
        window.print();
    });

    document.addEventListener('click', function (event) {
        var menu = document.querySelector('#notes details.hero-menu');
        if (menu && menu.open && !menu.contains(event.target)) {
            menu.open = false;
        }
    });

    // Chaque bouton insère sa syntaxe autour de la sélection (ou d'un
    // texte à trous si rien n'est sélectionné) plutôt que de composer
    // du HTML : la note reste du Markdown brut, l'aperçu se charge de
    // l'afficher mis en forme.
    //
    // Ce sont de vrais interrupteurs : avant d'ajouter un marqueur, on
    // vérifie s'il est déjà là pour le retirer plutôt que de l'empiler
    // (sinon un second clic sur Gras donnerait ****texte****). Deux cas
    // possibles pour un marqueur qui entoure du texte (gras, italique,
    // bloc de code) : la sélection est le texte pur, sans les
    // marqueurs (on les cherche juste avant/après la sélection) ; ou
    // la sélection inclut déjà les marqueurs (on les retire à
    // l'intérieur). Pour les titres et la liste, la détection se fait
    // ligne par ligne sur un préfixe.
    function finishEdit(selStart, selEnd) {
        textarea.focus();
        textarea.setSelectionRange(selStart, selEnd);
        textarea.dispatchEvent(new Event('input'));
    }

    function wrapSelection(before, after, placeholder) {
        var start = textarea.selectionStart;
        var end = textarea.selectionEnd;
        var value = textarea.value;
        var selected = value.slice(start, end) || placeholder;
        textarea.value = value.slice(0, start) + before + selected + after + value.slice(end);
        finishEdit(start + before.length, start + before.length + selected.length);
    }

    // Retire `marker` autour de la sélection s'il y est déjà ; renvoie
    // false sinon (rien fait, à ajouter par l'appelant).
    function stripAround(marker) {
        var start = textarea.selectionStart;
        var end = textarea.selectionEnd;
        var value = textarea.value;
        var mLen = marker.length;
        var selected = value.slice(start, end);

        // La sélection inclut déjà les marqueurs ("**texte**" entier).
        if (selected.length > mLen * 2
            && selected.slice(0, mLen) === marker
            && selected.slice(-mLen) === marker) {
            var inner = selected.slice(mLen, selected.length - mLen);
            textarea.value = value.slice(0, start) + inner + value.slice(end);
            finishEdit(start, start + inner.length);
            return true;
        }

        // Italique (un seul "*") : un "*" adjacent ne suffit pas à
        // conclure, puisqu'une paire de gras ("**") et un triple gras
        // + italique ("***") partagent le même caractère immédiat. On
        // compte toute la série d'astérisques de chaque côté : un
        // compte impair (1, ou 3 pour du texte déjà en gras) signifie
        // qu'il y a bien une couche italique, à retirer seule sans
        // toucher au gras ; un compte pair (0 ou 2) signifie qu'il n'y
        // en a pas encore.
        if (mLen === 1) {
            var runBefore = 0;
            while (start - runBefore - 1 >= 0 && value[start - runBefore - 1] === '*') {
                runBefore += 1;
            }
            var runAfter = 0;
            while (end + runAfter < value.length && value[end + runAfter] === '*') {
                runAfter += 1;
            }
            if (runBefore % 2 === 1 && runAfter % 2 === 1) {
                textarea.value = value.slice(0, start - 1) + selected + value.slice(end + 1);
                finishEdit(start - 1, start - 1 + selected.length);
                return true;
            }
            return false;
        }

        // Gras (deux "*") : les marqueurs entourent la sélection
        // ("texte" sélectionné seul, "**" de chaque côté en dehors).
        var before = value.slice(Math.max(0, start - mLen), start);
        var after = value.slice(end, end + mLen);
        if (before === marker && after === marker) {
            textarea.value = value.slice(0, start - mLen) + selected + value.slice(end + mLen);
            finishEdit(start - mLen, start - mLen + selected.length);
            return true;
        }

        return false;
    }

    function toggleWrap(marker, placeholder) {
        if (!stripAround(marker)) {
            wrapSelection(marker, marker, placeholder);
        }
    }

    function currentLineBlock() {
        var start = textarea.selectionStart;
        var end = textarea.selectionEnd;
        var value = textarea.value;
        var lineStart = value.lastIndexOf('\n', start - 1) + 1;
        var lineEnd = value.indexOf('\n', Math.max(end - 1, lineStart));
        if (lineEnd === -1) {
            lineEnd = value.length;
        }
        return {value: value, lineStart: lineStart, lineEnd: lineEnd, block: value.slice(lineStart, lineEnd)};
    }

    function toggleHeading(level) {
        var ctx = currentLineBlock();
        var prefix = '#'.repeat(level) + ' ';
        var headingPattern = /^(#{1,3})\s+/;

        var newBlock = ctx.block.split('\n').map(function (line) {
            var match = line.match(headingPattern);
            var withoutHeading = match ? line.slice(match[0].length) : line;
            var alreadyThisLevel = !!match && match[1].length === level;
            return alreadyThisLevel ? withoutHeading : prefix + withoutHeading;
        }).join('\n');

        textarea.value = ctx.value.slice(0, ctx.lineStart) + newBlock + ctx.value.slice(ctx.lineEnd);
        finishEdit(ctx.lineStart, ctx.lineStart + newBlock.length);
    }

    function toggleList() {
        var ctx = currentLineBlock();
        var listPattern = /^[-*]\s+/;
        var lines = ctx.block.split('\n');
        var nonBlank = lines.filter(function (line) { return line.trim() !== ''; });
        var allListed = nonBlank.length > 0 && nonBlank.every(function (line) { return listPattern.test(line); });

        var newBlock = lines.map(function (line) {
            if (line.trim() === '') {
                return line;
            }
            if (allListed) {
                return line.replace(listPattern, '');
            }
            return listPattern.test(line) ? line : '- ' + line;
        }).join('\n');

        textarea.value = ctx.value.slice(0, ctx.lineStart) + newBlock + ctx.value.slice(ctx.lineEnd);
        finishEdit(ctx.lineStart, ctx.lineStart + newBlock.length);
    }

    function toggleCodeBlock() {
        var start = textarea.selectionStart;
        var end = textarea.selectionEnd;
        var value = textarea.value;
        var selected = value.slice(start, end);

        // La sélection inclut déjà les clôtures ``` en entier.
        var fullMatch = selected.match(/^```\n([\s\S]*)\n```$/);
        if (fullMatch) {
            textarea.value = value.slice(0, start) + fullMatch[1] + value.slice(end);
            finishEdit(start, start + fullMatch[1].length);
            return;
        }

        // Les clôtures encadrent la sélection (le code seul est sélectionné).
        var openMatch = value.slice(0, start).match(/```\n$/);
        var closeMatch = value.slice(end).match(/^\n```/);
        if (openMatch && closeMatch) {
            var newStart = start - openMatch[0].length;
            var newEnd = end + closeMatch[0].length;
            textarea.value = value.slice(0, newStart) + selected + value.slice(newEnd);
            finishEdit(newStart, newStart + selected.length);
            return;
        }

        var replacement = '```\n' + (selected || 'code') + '\n```';
        textarea.value = value.slice(0, start) + replacement + value.slice(end);
        finishEdit(start + 4, start + 4 + (selected || 'code').length);
    }

    var TOOLBAR_ACTIONS = {
        bold: function () { toggleWrap('**', 'texte en gras'); },
        italic: function () { toggleWrap('*', 'texte en italique'); },
        h1: function () { toggleHeading(1); },
        h2: function () { toggleHeading(2); },
        h3: function () { toggleHeading(3); },
        list: function () { toggleList(); },
        code: function () { toggleCodeBlock(); }
    };

    document.querySelectorAll('.toolbar-btn[data-md]').forEach(function (button) {
        button.addEventListener('click', function () {
            var action = TOOLBAR_ACTIONS[button.getAttribute('data-md')];
            if (action) {
                action();
            }
        });
    });

    function renderEmptyPreview() {
        preview.innerHTML = '';

        var emptyHint = document.createElement('p');
        emptyHint.className = 'hint';
        emptyHint.textContent = 'Pas encore de note.';
        preview.appendChild(emptyHint);

        var editButton = document.createElement('button');
        editButton.type = 'button';
        editButton.className = 'btn-mini';
        editButton.textContent = 'Éditer';
        editButton.addEventListener('click', function () { setPreviewMode(false); });
        preview.appendChild(editButton);
    }

    function setPreviewMode(active) {
        preview.hidden = !active;
        textarea.hidden = active;
        previewToggle.textContent = active ? 'Éditer' : 'Aperçu';
        document.querySelectorAll('.toolbar-btn').forEach(function (button) {
            button.hidden = active;
        });
        if (active) {
            if (textarea.value.trim()) {
                preview.innerHTML = renderMarkdown(textarea.value);
            } else {
                renderEmptyPreview();
            }
        } else {
            textarea.focus();
        }
    }

    // Le bouton Aperçu/Éditer se déclenche au clic, après un éventuel
    // "blur" du champ (voir plus bas) qui aurait déjà changé l'état —
    // l'intention réelle du clic est capturée dès le "mousedown", qui
    // se produit avant ce "blur", pour ne pas se retrouver à l'annuler
    // par erreur juste après.
    var toggleIntent = null;
    previewToggle.addEventListener('mousedown', function () {
        toggleIntent = preview.hidden;
    });
    previewToggle.addEventListener('click', function () {
        var goToPreview = toggleIntent !== null ? toggleIntent : preview.hidden;
        toggleIntent = null;
        if (goToPreview) {
            clearTimeout(saveTimer);
            saveToServer(false);
        }
        setPreviewMode(goToPreview);
    });

    {% if player_context %}
    // Sur le lecteur, on écrit en regardant la vidéo : l'édition reste
    // le mode par défaut, un aller-retour supplémentaire par note
    // serait pénible.
    {% else %}
    // Sur la fiche, l'aperçu est le mode par défaut ; l'édition n'est
    // qu'une parenthèse. On y retourne dès que le focus quitte le
    // champ (pas seulement au bout des 900 ms de la sauvegarde
    // automatique, qui se déclenche aussi en pleine réflexion entre
    // deux phrases) — sauf si le focus reste dans le bloc Notes (un
    // bouton de la barre d'outils, qui reprend lui-même le focus juste
    // après).
    setPreviewMode(true);

    textarea.addEventListener('blur', function (event) {
        if (event.relatedTarget && noteCard.contains(event.relatedTarget)) {
            return;
        }
        clearTimeout(saveTimer);
        saveToServer(false);
        setPreviewMode(true);
    });
    {% endif %}

    renderMarkers();

    // Filet local : si une frappe n'est jamais parvenue au serveur
    // (crash juste avant l'envoi differe), on la retrouve ici.
    try {
        var local = JSON.parse(localStorage.getItem(storageKey) || 'null');
        if (local && local.savedAt > serverUpdatedAtMs && local.text !== textarea.value) {
            var banner = document.getElementById('local-restore-banner');
            var message = document.createElement('div');
            message.className = 'hint';
            message.style.marginBottom = '8px';
            message.textContent = 'Une version plus récente de cette note, jamais enregistrée, a été retrouvée dans ce navigateur. ';

            var restoreButton = document.createElement('button');
            restoreButton.type = 'button';
            restoreButton.className = 'btn-mini';
            restoreButton.textContent = 'Restaurer';
            restoreButton.addEventListener('click', function () {
                textarea.value = local.text;
                banner.innerHTML = '';
                renderMarkers();
                saveToServer(false);
                setPreviewMode(false);
            });

            message.appendChild(restoreButton);
            banner.appendChild(message);
        }
    } catch (e) {
        /* stockage local illisible : on ignore, rien a restaurer */
    }

    {% if player_context %}
    document.getElementById('insert-marker').addEventListener('click', function () {
        var player = document.getElementById('player');
        var seconds = Math.floor(player.currentTime);
        var minutes = Math.floor(seconds / 60);
        var remaining = String(seconds % 60).padStart(2, '0');
        var timestamp = minutes + ':' + remaining;
        {% if player_context.kind == 'audio' %}
        // Un audiobook n'a qu'un seul fichier : ni numéro de vidéo ni
        // titre à répéter, le repère se suffit de l'horodatage.
        var marker = timestamp + ' (/listen/{{ player_context.media_id }}?t=' + seconds + ')\n';
        {% else %}
        // Lus sur le lecteur (data-media-id/number/title), jamais figés
        // dans ce script : le changement de vidéo sans rechargement
        // (tranche dédiée) les met à jour à chaque navigation, ce
        // bouton doit donc toujours viser la vidéo réellement affichée.
        var marker = 'Vidéo ' + player.dataset.number + ' — ' + player.dataset.title + ' — '
            + timestamp + ' (/watch/' + player.dataset.mediaId + '?t=' + seconds + ')\n';
        {% endif %}

        var position = textarea.selectionStart;
        if (typeof position !== 'number') {
            position = textarea.value.length;
        }

        textarea.value = textarea.value.slice(0, position) + marker + textarea.value.slice(position);
        textarea.dispatchEvent(new Event('input'));
    });
    {% endif %}
})();
</script>
{% endmacro %}


{% macro render_print_block(item_title) %}
<div id="print-only">
    <h1>{{ item_title }}</h1>
    <p class="print-date"></p>
    <div id="print-note-text" class="note-preview"></div>
</div>
{% endmacro %}
